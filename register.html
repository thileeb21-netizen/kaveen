<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Elite Hotel Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>Create an Account</h2>
                <p>Join us at Elite Hotel</p>
            </div>
            <form action="#" method="post">
                <div class="input-group">
                    <input type="text" id="fullname" name="fullname" required placeholder=" ">
                    <label for="fullname">Full Name</label>
                </div>
                <div class="input-group">
                    <input type="email" id="email" name="email" required placeholder=" ">
                    <label for="email">Email</label>
                </div>
                <!-- OTP for email will be handled in a subsequent step -->
                <div class="input-group">
                    <input type="tel" id="phone" name="phone" required placeholder=" ">
                    <label for="phone">Phone Number</label>
                </div>
                <!-- OTP for phone will be handled in a subsequent step -->
                <div class="input-group">
                    <input type="text" id="username" name="username" required placeholder=" ">
                    <label for="username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" required placeholder=" ">
                    <label for="password">Password</label>
                </div>
                <div class="input-group">
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder=" ">
                    <label for="confirm-password">Confirm Password</label>
                </div>
                 <div class="input-group">
                     <label for="role" class="sr-only">Role</label>
                     <select id="role" name="role">
                        <option value="guest" selected>Guest</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="input-group" id="address-field">
                    <textarea id="address" name="address" placeholder=" "></textarea>
                    <label for="address">Address (for Guests)</label>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
                <div class="form-footer">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </form>
        </div>
    </div>
    <script src="js/main.js" defer></script>
</body>
</html>
