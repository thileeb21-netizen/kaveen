<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hotel Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Hotel Management System</h1>
    </header>
    <main>
        <section id="login-form">
            <h2>User Login</h2>
            <form action="guest_dashboard.html" method="post">
                <div class="form-group">
                    <label for="role">Role:</label>
                    <select id="role" name="role">
                        <option value="guest" selected>Guest</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </section>
        <section id="dev-links">
            <h2>Development Links</h2>
            <p>For demonstration purposes, you can use these links to navigate to the different dashboards:</p>
            <ul>
                <li><a href="guest_dashboard.html">Guest Dashboard</a></li>
                <li><a href="staff_dashboard.html">Staff Dashboard</a></li>
                <li><a href="admin_dashboard.html">Admin Dashboard</a></li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Hotel Management System</p>
    </footer>
</body>
</html>
