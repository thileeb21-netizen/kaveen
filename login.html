<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elite Hotel Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <!-- Assuming a logo file will be placed here -->
                <img src="assets/logo.png" alt="Elite Hotel Logo" class="logo" style="display:none;">
                <h2>Welcome to Elite Hotel</h2>
                <p>Sign in to continue</p>
            </div>
            <form action="guest_dashboard.html" method="post">
                <div class="input-group">
                    <input type="text" id="username" name="username" required placeholder=" ">
                    <label for="username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" required placeholder=" ">
                    <label for="password">Password</label>
                </div>
                <div class="input-group">
                     <label for="role" class="sr-only">Role</label>
                     <select id="role" name="role">
                        <option value="guest" selected>Guest</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-actions">
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <button type="button" class="btn btn-secondary">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
